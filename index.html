<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..600;1,9..40,300..600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* 前台文案與照片：請到 /admin/ 後台編輯 content/site.json */
/* 英文：Newsreader + DM Sans；中文：Noto Serif TC + Noto Sans TC */

:root{
  --black:#0b0b0a;
  --panel:#141412;
  --white:#f2f0eb;
  --gray-1:#a5a199;
  --gray-2:#524e46;
  --hair: rgba(242,240,235,0.14);
  --hair-strong: rgba(242,240,235,0.28);
  --maxw: 1240px;
  --ease: cubic-bezier(.16,.84,.44,1);
  --font-serif: 'Newsreader', 'Noto Serif TC', 'Source Han Serif TC', serif;
  --font-sans: 'DM Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  --font-mono: 'IBM Plex Mono', 'Noto Sans TC', ui-monospace, monospace;
}

*{margin:0;padding:0;box-sizing:border-box;}

html{scroll-behavior:smooth;}

body{
  background:var(--black);
  color:var(--white);
  font-family:var(--font-sans);
  font-weight:300;
  line-height:1.6;
  overflow-x:hidden;
  position:relative;
}

/* 底片顆粒質感 */
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:9999;
  pointer-events:none;
  opacity:0.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

.wrap{max-width:var(--maxw); margin:0 auto; padding:0 40px;}

.eyebrow{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--gray-1);
  display:flex;
  align-items:center;
  gap:14px;
}
.eyebrow::before{
  content:"";
  width:28px; height:1px;
  background:var(--gray-1);
  display:inline-block;
}

h1,h2,h3{
  font-family:var(--font-serif);
  font-weight:400;
  letter-spacing:-0.01em;
}

a{color:inherit; text-decoration:none;}

/* reveal on scroll */
.reveal{opacity:0; transform:translateY(28px); transition:opacity 1s var(--ease), transform 1s var(--ease);}
.reveal.in{opacity:1; transform:translateY(0);}

@media (prefers-reduced-motion: reduce){
  .reveal{opacity:1 !important; transform:none !important; transition:none !important;}
  *{animation:none !important;}
}

/* ---------- NAV ---------- */
header{
  position:fixed; top:0; left:0; right:0; z-index:100;
  padding:26px 0;
  mix-blend-mode:difference;
}
header .wrap{display:flex; justify-content:space-between; align-items:center;}
.logo{
  font-family:var(--font-serif);
  font-style:italic;
  font-size:20px;
  letter-spacing:0.02em;
}
nav ul{list-style:none; display:flex; gap:36px;}
nav a{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  position:relative;
}
nav a::after{
  content:"";
  position:absolute; left:0; bottom:-6px;
  width:0; height:1px; background:var(--white);
  transition:width .4s var(--ease);
}
nav a:hover::after{width:100%;}
.nav-toggle{display:none;}

/* ---------- HERO ---------- */
.hero{
  min-height:100svh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  position:relative;
  padding-top:120px;
}
.horizon-line{
  position:absolute;
  left:0; right:0; top:58%;
  height:1px;
  background:var(--hair-strong);
  transform:scaleX(0);
  transform-origin:left;
  animation:draw-horizon 1.8s var(--ease) 0.3s forwards;
}
@keyframes draw-horizon{ to{ transform:scaleX(1); } }

.hero .wrap{position:relative; z-index:2;}
.hero-meta{
  display:flex; justify-content:space-between; align-items:flex-end;
  margin-bottom:26px;
}
.hero-coords{
  font-family:var(--font-mono);
  font-size:12px; color:var(--gray-1); letter-spacing:0.08em;
  text-align:right;
}
h1.hero-title{
  font-size:clamp(42px, 8vw, 108px);
  font-weight:300;
  line-height:1.02;
  max-width:14ch;
}
h1.hero-title em{
  font-style:italic; font-weight:300; color:var(--gray-1);
}
.hero-sub{
  margin-top:34px;
  max-width:44ch;
  font-size:17px;
  color:var(--gray-1);
  font-weight:300;
}
.hero-bottom{
  margin-top:90px;
  display:flex; justify-content:space-between; align-items:center;
  padding-top:22px;
  border-top:1px solid var(--hair);
}
.scroll-cue{
  font-family:var(--font-mono);
  font-size:11px; letter-spacing:0.15em; text-transform:uppercase;
  color:var(--gray-1);
  display:flex; align-items:center; gap:10px;
}
.scroll-cue .dot{
  width:6px; height:6px; border-radius:50%;
  background:var(--white);
  animation:pulse 2.2s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:.3;} 50%{opacity:1;} }

/* sun tracker along right edge, follows scroll (landscape motif) */
.sun-track{
  position:fixed; right:26px; top:18%; bottom:18%;
  width:1px; background:var(--hair);
  z-index:50;
}
.sun-dot{
  position:absolute; left:50%; top:0;
  width:7px; height:7px; margin-left:-3.5px;
  border-radius:50%; background:var(--white);
  box-shadow:0 0 12px rgba(242,240,235,0.6);
  transition:top .1s linear;
}
@media (max-width: 860px){ .sun-track{display:none;} }

/* ---------- SECTION generic ---------- */
section{padding:150px 0;}
.section-head{
  display:flex; justify-content:space-between; align-items:flex-end;
  margin-bottom:70px; gap:40px; flex-wrap:wrap;
}
.section-head h2{font-size:clamp(30px,4vw,48px); font-weight:300;}
.section-head p{max-width:36ch; color:var(--gray-1); font-size:15px;}

/* ---------- ABOUT ---------- */
.about{border-top:1px solid var(--hair);}
.about-grid{
  display:grid; grid-template-columns:0.9fr 1.1fr; gap:80px; align-items:start;
}
.about-frame{aspect-ratio:4/5;}
.about-text p{font-size:19px; font-weight:300; color:var(--white); margin-bottom:22px;}
.about-text p.lead{
  font-family:var(--font-serif); font-style:italic; font-size:26px; color:var(--gray-1);
  line-height:1.5; margin-bottom:34px;
}
.about-stats{display:flex; gap:50px; margin-top:44px; padding-top:30px; border-top:1px solid var(--hair);}
.stat b{font-family:var(--font-serif); font-size:34px; font-weight:400; display:block;}
.stat span{font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; color:var(--gray-1); text-transform:uppercase;}

@media (max-width:860px){
  .about-grid{grid-template-columns:1fr; gap:40px;}
}

/* ---------- placeholder frame (照片替換點) ---------- */
.ph{
  position:relative;
  width:100%; height:100%;
  background:
    linear-gradient(135deg, #201f1c 0%, #0b0b0a 60%);
  border:1px solid var(--hair);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.ph::before{
  content:""; position:absolute; inset:0;
  background-image:repeating-linear-gradient(45deg, rgba(242,240,235,0.035) 0 2px, transparent 2px 14px);
}
.ph-label{
  font-family:var(--font-mono); font-size:11px; letter-spacing:0.12em;
  color:var(--gray-1); text-transform:uppercase; text-align:center; z-index:1;
  border:1px dashed var(--hair-strong); padding:10px 16px;
}
.ph-img{width:100%; height:100%; object-fit:cover; display:block;}

/* ---------- WORK / PORTFOLIO ---------- */
.work-grid{display:flex; flex-direction:column; gap:130px;}
.work-item{display:grid; grid-template-columns:1fr; gap:26px;}
.work-item .frame{width:100%; aspect-ratio:16/9;}
.work-item.wide .frame{aspect-ratio:21/9;}
.work-item.pair{grid-template-columns:1fr 1fr; gap:26px;}
.work-item.pair .frame{aspect-ratio:4/5;}
.work-caption{
  display:flex; justify-content:space-between; align-items:baseline;
  padding-top:18px; border-top:1px solid var(--hair);
}
.work-caption h3{font-size:24px; font-weight:400;}
.work-coords{
  font-family:var(--font-mono); font-size:12px; color:var(--gray-1); text-align:right;
  line-height:1.7;
}
@media (max-width:760px){
  .work-item.pair{grid-template-columns:1fr;}
}

/* ---------- SERVICES ---------- */
.services{border-top:1px solid var(--hair);}
.service-list{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--hair);}
.service{
  background:var(--black); padding:46px 34px;
  display:flex; flex-direction:column; gap:22px;
  transition:background .4s var(--ease);
}
.service:hover{background:var(--panel);}
.service .num{font-family:var(--font-mono); font-size:12px; color:var(--gray-1);}
.service h3{font-size:24px; font-weight:400; margin-top:6px;}
.service p{color:var(--gray-1); font-size:15px; flex:1;}
.service .tag{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--white); border-top:1px solid var(--hair); padding-top:16px;
}
@media (max-width:860px){ .service-list{grid-template-columns:1fr;} }

/* ---------- PROCESS ---------- */
.process{border-top:1px solid var(--hair);}
.process-list{display:grid; grid-template-columns:repeat(4,1fr); gap:36px;}
.process-step .num{
  font-family:var(--font-serif); font-style:italic; font-size:44px; color:var(--gray-2);
}
.process-step h3{font-size:19px; font-weight:400; margin:16px 0 10px;}
.process-step p{font-size:14px; color:var(--gray-1);}
@media (max-width:860px){ .process-list{grid-template-columns:1fr 1fr; gap:44px;} }
@media (max-width:520px){ .process-list{grid-template-columns:1fr;} }

/* ---------- CONTACT ---------- */
.contact{border-top:1px solid var(--hair); position:relative;}
.contact-grid{display:grid; grid-template-columns:1.1fr 0.9fr; gap:60px;}
.contact h2{font-size:clamp(36px,6vw,64px); font-weight:300; max-width:12ch; margin-bottom:30px;}
.contact-email{
  font-family:var(--font-mono); font-size:clamp(18px,2.4vw,26px);
  display:inline-block; padding-bottom:8px; border-bottom:1px solid var(--hair-strong);
  transition:border-color .4s var(--ease), letter-spacing .4s var(--ease);
}
.contact-email:hover{border-color:var(--white); letter-spacing:0.01em;}
.contact-links{list-style:none; margin-top:40px; display:flex; flex-direction:column; gap:12px;}
.contact-links a{font-size:14px; color:var(--gray-1); font-family:var(--font-mono);}
.contact-links a:hover{color:var(--white);}

.contact-form{display:flex; flex-direction:column; gap:0;}
.field{border-bottom:1px solid var(--hair); padding:18px 0;}
.field label{
  display:block; font-family:var(--font-mono); font-size:11px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--gray-1); margin-bottom:10px;
}
.field input, .field select, .field textarea{
  width:100%; background:transparent; border:none; color:var(--white);
  font-family:var(--font-sans); font-size:16px; font-weight:300; outline:none; resize:none;
}
.field input::placeholder, .field textarea::placeholder{color:#4a4842;}
.submit-btn{
  margin-top:30px; align-self:flex-start;
  padding:16px 34px; border:1px solid var(--white); background:transparent; color:var(--white);
  font-family:var(--font-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  cursor:pointer; transition:background .35s var(--ease), color .35s var(--ease);
}
.submit-btn:hover{background:var(--white); color:var(--black);}

@media (max-width:860px){ .contact-grid{grid-template-columns:1fr; gap:50px;} }

footer{
  border-top:1px solid var(--hair);
  padding:36px 0;
}
footer .wrap{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--gray-1); letter-spacing:.06em;}

/* focus visibility */
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
  outline:2px solid var(--white); outline-offset:3px;
}
</style>
</head>
<body>

<div class="sun-track"><div class="sun-dot" id="sunDot"></div></div>

<header>
  <div class="wrap">

      <ul>

<main id="top">

  <section class="hero">

    <div class="wrap">
      <div class="hero-meta reveal">

  <section id="work">

</main>

<footer>
  <div class="wrap">
    <span data-field="copyright"></span>
    <span data-field="site_tagline"></span>
  </div>
</footer>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="js/content.js"></script>
<script>
const sunDot = document.getElementById('sunDot');
function updateSun(){
  const track = document.querySelector('.sun-track');
  if(!track || !sunDot) return;
  const doc = document.documentElement;
  const scrollPct = (doc.scrollTop) / (doc.scrollHeight - doc.clientHeight || 1);
  const trackHeight = track.clientHeight;
  const pos = Math.min(Math.max(scrollPct,0),1) * trackHeight;
  sunDot.style.top = pos + 'px';
}
document.addEventListener('scroll', updateSun, {passive:true});
window.addEventListener('resize', updateSun);
updateSun();

if (window.netlifyIdentity) {
  window.netlifyIdentity.on('init', function (user) {
    if (!user) {
      window.netlifyIdentity.on('login', function () {
        document.location.href = '/admin/';
      });
    }
  });
}
</script>
